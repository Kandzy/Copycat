<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details</title>
    <link rel="stylesheet" href="/static/css/user/details.css">
</head>
<body>
    <div class="container">
        <h1>User Details</h1>

        <div class="detail-item">
            <label>Username</label>
            <div class="value">{{ .Username }}</div>
        </div>

        <div class="detail-item">
            <label>Discord ID</label>
            <div class="value">{{ .DiscordID }}</div>
            <button onclick="connectDiscord()">Connect New Discord Account</button>
        </div>

        <div class="detail-item">
            <label>User Group</label>
            <div class="user-group">{{ .UserGroup }}</div>
        </div>

        <div class="detail-item">
            <label>Password</label>
            <button onclick="resetPassword()">Reset Password</button>
        </div>
    </div>

    <script>
        function resetPassword() {
            // Handle password reset
            window.location.href = '/user/reset-password';
        }

        function connectDiscord() {
            // Handle Discord connection
            window.location.href = '/user/connect-discord';
        }
    </script>
</body>
</html>
