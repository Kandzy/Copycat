<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="/static/css/signup.css">
</head>
<body>
    <div class="wrap">
        <form class="card" id="signup-form" action="/signup" method="POST" autocomplete="on" novalidate>
            <h1>Create an account</h1>
            <p class="lead">Sign up with your email, choose a username and a secure password.</p>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required placeholder="you@example.com" />

            <label for="username">Username</label>
            <input id="username" name="username" type="text" required minlength="3" maxlength="32" placeholder="your username" />

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="8" placeholder="at least 8 characters" />

            <div class="actions">
                <button type="submit" class="btn btn-primary">Sign up</button>
                <a class="btn-ghost" href="/login" role="button">Back to login</a>
            </div>

            <p class="small" style="margin-top:14px;">By signing up you agree to the terms of service and privacy policy.</p>
        </form>
    </div>
</body>
</html>
